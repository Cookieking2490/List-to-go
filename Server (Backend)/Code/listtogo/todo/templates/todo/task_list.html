<h1>Task List</h1>
<ul>
    {% for task in tasks %}
        <li>
            {{ task.name }} - {{ task.status }} - {{ task.priority }} - {{ task.category }} - {{ task.due_date }}
            | <a href="{% url 'edit_task' task.id %}">Edit</a>
            | <a href="{% url 'delete_task' task.id %}">Delete</a>
        </li>
    {% empty %}
        <p>No tasks available.</p>
    {% endfor %}
</ul>
